<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pixel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0e10;
      --surface: #131316;
      --surface2: #1c1c21;
      --border: #27272d;
      --text: #e1e1e6;
      --text2: #8b8b9a;
      --text3: #55555f;
      --accent: #7c3aed;
      --accent2: #9d60f8;
      --green: #22c55e;
      --red: #ef4444;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    /* ══ GHOST CSS ══ */
    #ghost-el { position: relative; }
    #ghost-body {
      animation: upNDown .5s infinite; position: relative;
      width: 140px; height: 140px; display: grid;
      grid-template-columns: repeat(14, 1fr); grid-template-rows: repeat(14, 1fr);
      grid-template-areas:
        "a1 a2 a3 a4 a5 top0 top0 top0 top0 a10 a11 a12 a13 a14"
        "b1 b2 b3 top1 top1 top1 top1 top1 top1 top1 top1 b12 b13 b14"
        "c1 c2 top2 top2 top2 top2 top2 top2 top2 top2 top2 top2 c13 c14"
        "d1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 d14"
        "e1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 e14"
        "f1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 f14"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "st0 st0 an4 st1 an7 st2 an10 an10 st3 an13 st4 an16 st5 st5"
        "an1 an2 an3 an5 an6 an8 an9 an9 an11 an12 an14 an15 an17 an18";
    }
    @keyframes upNDown { 0%,49%{transform:translateY(0)} 50%,100%{transform:translateY(-8px)} }
    #top0,#top1,#top2,#top3,#top4,#st0,#st1,#st2,#st3,#st4,#st5{background:#7c3aed}
    #top0{grid-area:top0}#top1{grid-area:top1}#top2{grid-area:top2}#top3{grid-area:top3}#top4{grid-area:top4}
    #st0{grid-area:st0}#st1{grid-area:st1}#st2{grid-area:st2}#st3{grid-area:st3}#st4{grid-area:st4}#st5{grid-area:st5}
    #an1{grid-area:an1;animation:f0 .5s infinite}#an18{grid-area:an18;animation:f0 .5s infinite}
    #an2{grid-area:an2;animation:f1 .5s infinite}#an17{grid-area:an17;animation:f1 .5s infinite}
    #an3{grid-area:an3;animation:f1 .5s infinite}#an16{grid-area:an16;animation:f1 .5s infinite}
    #an4{grid-area:an4;animation:f1 .5s infinite}#an15{grid-area:an15;animation:f1 .5s infinite}
    #an5{grid-area:an5}#an6{grid-area:an6;animation:f0 .5s infinite}
    #an7{grid-area:an7;animation:f0 .5s infinite}#an8{grid-area:an8;animation:f0 .5s infinite}
    #an9{grid-area:an9;animation:f1 .5s infinite}#an10{grid-area:an10;animation:f1 .5s infinite}
    #an11{grid-area:an11;animation:f0 .5s infinite}#an12{grid-area:an12;animation:f0 .5s infinite}
    #an13{grid-area:an13;animation:f0 .5s infinite}#an14{grid-area:an14}
    @keyframes f0{0%,49%{background:#7c3aed}50%,100%{background:transparent}}
    @keyframes f1{0%,49%{background:transparent}50%,100%{background:#7c3aed}}
    #g-eye{width:40px;height:50px;position:absolute;top:30px;left:10px}
    #g-eye::before{content:"";background:white;width:20px;height:50px;transform:translateX(10px);display:block;position:absolute}
    #g-eye::after{content:"";background:white;width:40px;height:30px;transform:translateY(10px);display:block;position:absolute}
    #g-eye1{width:40px;height:50px;position:absolute;top:30px;right:30px}
    #g-eye1::before{content:"";background:white;width:20px;height:50px;transform:translateX(10px);display:block;position:absolute}
    #g-eye1::after{content:"";background:white;width:40px;height:30px;transform:translateY(10px);display:block;position:absolute}
    #g-pupil{width:20px;height:20px;background:#4c1d95;position:absolute;top:50px;left:10px;z-index:1;animation:eyes 3s infinite}
    #g-pupil1{width:20px;height:20px;background:#4c1d95;position:absolute;top:50px;right:50px;z-index:1;animation:eyes 3s infinite}
    @keyframes eyes{0%,49%{transform:translateX(0)}50%,99%{transform:translateX(10px)}100%{transform:translateX(0)}}
    #g-shadow{background:#7c3aed;width:140px;height:140px;position:absolute;border-radius:50%;transform:rotateX(80deg);filter:blur(20px);top:80%;animation:gshadow .5s infinite}
    @keyframes gshadow{0%,49%{opacity:.25}50%,100%{opacity:.08}}

    /* ══ LAYOUT ══ */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── TOP BAR ── */
    .topbar {
      height: 48px; flex-shrink: 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 14px; gap: 12px;
    }
    .topbar-brand { display: flex; align-items: center; gap: 8px; }
    .topbar-logo { scale: 0.18; transform-origin: left center; width: 26px; height: 26px; overflow: visible; position: relative; }
    .topbar-name { font-size: .9rem; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
    .topbar-divider { width: 1px; height: 18px; background: var(--border); }
    .topbar-project { font-size: .8rem; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .btn-publish {
      background: var(--accent); color: white; border: none; border-radius: 7px;
      padding: 6px 14px; font-size: .78rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: background .15s;
    }
    .btn-publish:hover { background: #6d28d9; }

    /* ── SPLIT ── */
    .split { display: flex; flex: 1; overflow: hidden; }

    /* ── LEFT PANEL ── */
    .left-panel {
      width: 420px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }

    /* Feed */
    .feed {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 18px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .feed::-webkit-scrollbar { width: 4px; }
    .feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Welcome state */
    .welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; gap: 16px; padding: 40px 0; text-align: center;
    }
    .welcome-ghost { scale: 0.55; transform-origin: center center; margin-bottom: -40px; }
    .welcome-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .welcome-sub { font-size: .82rem; color: var(--text2); line-height: 1.5; max-width: 260px; }

    /* Messages */
    .msg { display: flex; flex-direction: column; gap: 4px; }
    .msg.user { align-items: flex-end; }
    .msg.user .bubble {
      background: var(--accent); color: white;
      border-radius: 16px 16px 4px 16px;
      padding: 9px 14px; font-size: .84rem; line-height: 1.55;
      max-width: 85%; word-break: break-word; white-space: pre-wrap;
    }
    .msg.agent .agent-label {
      font-size: .7rem; font-weight: 600; color: var(--accent2);
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px;
    }
    .msg.agent .text {
      font-size: .84rem; line-height: 1.65; color: var(--text);
      white-space: pre-wrap; word-break: break-word; max-width: 100%;
    }
    .arch-box {
      background: #0d0d0f; border: 1px solid #2a1f4e;
      border-radius: 8px; padding: 12px 14px;
      font-family: monospace; font-size: .75rem; color: #a78bfa;
      line-height: 1.7; white-space: pre; overflow-x: auto; margin-top: 6px;
    }

    /* Typing indicator */
    .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent2);
      animation: tdot .8s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: .15s; }
    .typing-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes tdot { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-5px);opacity:1} }

    /* Action pills (file write / command) */
    .action-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 10px;
      font-size: .74rem; color: var(--text2);
      max-width: 100%; overflow: hidden;
    }
    .action-pill svg { flex-shrink: 0; opacity: .7; }
    .action-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .action-pill.file { border-color: #3b2a6e; color: #a78bfa; }
    .action-pill.file svg { opacity: 1; }
    .action-pill.cmd { font-family: monospace; }
    .actions-group { display: flex; flex-direction: column; gap: 4px; }
    .actions-count {
      font-size: .7rem; color: var(--text3); margin-top: 2px;
      display: flex; align-items: center; gap: 4px; cursor: pointer;
    }
    .actions-count:hover { color: var(--text2); }

    /* Build start bar */
    .build-approved {
      background: linear-gradient(135deg, #1e1030, #130d26);
      border: 1px solid #3b2a6e; border-radius: 10px;
      padding: 12px 14px; display: flex; align-items: center; gap: 10px;
    }
    .build-approved-text { flex: 1; font-size: .82rem; color: #c4b5fd; }
    .build-approved-text strong { color: white; display: block; font-size: .84rem; margin-bottom: 2px; }
    .btn-build {
      background: var(--accent); color: white; border: none; border-radius: 7px;
      padding: 7px 14px; font-size: .78rem; font-weight: 600; cursor: pointer;
      font-family: inherit; white-space: nowrap; transition: background .15s;
    }
    .btn-build:hover { background: #6d28d9; }

    /* Input area */
    .input-area {
      padding: 12px 14px; border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px;
      transition: border-color .15s;
    }
    .input-row:focus-within { border-color: var(--accent); }
    .input-field {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: .84rem; font-family: inherit;
      resize: none; max-height: 120px; line-height: 1.5;
    }
    .input-field::placeholder { color: var(--text3); }
    .btn-send {
      width: 30px; height: 30px; border-radius: 7px;
      background: var(--accent); border: none; color: white;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s;
    }
    .btn-send:hover { background: #6d28d9; }
    .btn-send:disabled { background: #3b2a6e; cursor: not-allowed; }

    /* ── RIGHT PANEL ── */
    .right-panel {
      flex: 1; background: var(--bg);
      display: flex; flex-direction: column;
    }
    .preview-topbar {
      height: 40px; flex-shrink: 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 14px; gap: 8px;
    }
    .preview-tab {
      font-size: .78rem; font-weight: 500; color: var(--text2);
      padding: 4px 10px; border-radius: 6px; cursor: pointer;
    }
    .preview-tab.active { background: var(--surface2); color: var(--text); }
    .preview-url {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 10px; font-size: .74rem; color: var(--text2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: monospace;
    }
    .preview-body { flex: 1; position: relative; overflow: hidden; }
    .preview-body iframe { width: 100%; height: 100%; border: none; }

    /* Empty state */
    .preview-empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: var(--text3);
    }
    .preview-empty svg { opacity: .2; }
    .preview-empty p { font-size: .82rem; }

    /* Skeleton loader */
    .skeleton-wrap {
      position: absolute; inset: 0;
      padding: 24px; display: flex; flex-direction: column; gap: 16px;
      overflow: hidden;
    }
    .skel {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
    .skel-header { height: 48px; width: 100%; }
    .skel-hero { height: 180px; width: 100%; }
    .skel-row { height: 16px; border-radius: 4px; }
    .skel-cards { display: flex; gap: 12px; }
    .skel-card { height: 100px; flex: 1; }

    /* ══ UTIL ══ */
    @keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .fadein { animation: fadein .2s ease both; }
  </style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <!-- Inline mini ghost using scale trick -->
      <div style="position:relative;width:22px;height:22px;overflow:visible;display:flex;align-items:center">
        <div style="scale:0.14;transform-origin:left center;position:absolute;left:0;top:-8px">
          <div id="ghost-el">
            <div id="ghost-body">
              <div id="top0"></div><div id="top1"></div><div id="top2"></div>
              <div id="top3"></div><div id="top4"></div>
              <div id="st0"></div><div id="st1"></div><div id="st2"></div>
              <div id="st3"></div><div id="st4"></div><div id="st5"></div>
              <div id="an1"></div><div id="an2"></div><div id="an3"></div>
              <div id="an4"></div><div id="an5"></div><div id="an6"></div>
              <div id="an7"></div><div id="an8"></div><div id="an9"></div>
              <div id="an10"></div><div id="an11"></div><div id="an12"></div>
              <div id="an13"></div><div id="an14"></div><div id="an15"></div>
              <div id="an16"></div><div id="an17"></div><div id="an18"></div>
            </div>
            <div id="g-eye"><div id="g-pupil"></div></div>
            <div id="g-eye1"><div id="g-pupil1"></div></div>
            <div id="g-shadow"></div>
          </div>
        </div>
      </div>
      <span class="topbar-name">Pixel</span>
    </div>
    <div class="topbar-divider"></div>
    <div class="topbar-project" id="topbar-project">New Project</div>
    <div class="topbar-actions">
      <button class="btn-publish" id="btn-publish" style="display:none" onclick="openDeploy()">Publish ↗</button>
    </div>
  </div>

  <!-- SPLIT -->
  <div class="split">

    <!-- LEFT: Chat feed -->
    <div class="left-panel">
      <div class="feed" id="feed">
        <!-- Welcome -->
        <div class="welcome" id="welcome">
          <div class="welcome-ghost">
            <div style="position:relative">
              <div id="w-ghost-body" style="animation:upNDown .5s infinite;position:relative;width:140px;height:140px;display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(14,1fr);grid-template-areas:'a1 a2 a3 a4 a5 wt0 wt0 wt0 wt0 a10 a11 a12 a13 a14' 'b1 b2 b3 wt1 wt1 wt1 wt1 wt1 wt1 wt1 wt1 b12 b13 b14' 'c1 c2 wt2 wt2 wt2 wt2 wt2 wt2 wt2 wt2 wt2 wt2 c13 c14' 'd1 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 d14' 'e1 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 e14' 'f1 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 wt3 f14' 'wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4' 'wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4' 'wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4' 'wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4' 'wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4' 'wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4 wt4' 'ws0 ws0 wa4 ws1 wa7 ws2 wa10 wa10 ws3 wa13 ws4 wa16 ws5 ws5' 'wa1 wa2 wa3 wa5 wa6 wa8 wa9 wa9 wa11 wa12 wa14 wa15 wa17 wa18'">
                <div style="grid-area:wt0;background:#7c3aed"></div>
                <div style="grid-area:wt1;background:#7c3aed"></div>
                <div style="grid-area:wt2;background:#7c3aed"></div>
                <div style="grid-area:wt3;background:#7c3aed"></div>
                <div style="grid-area:wt4;background:#7c3aed"></div>
                <div style="grid-area:ws0;background:#7c3aed"></div>
                <div style="grid-area:ws1;background:#7c3aed"></div>
                <div style="grid-area:ws2;background:#7c3aed"></div>
                <div style="grid-area:ws3;background:#7c3aed"></div>
                <div style="grid-area:ws4;background:#7c3aed"></div>
                <div style="grid-area:ws5;background:#7c3aed"></div>
                <div style="grid-area:wa4;animation:f1 .5s infinite"></div>
                <div style="grid-area:wa7;animation:f0 .5s infinite"></div>
                <div style="grid-area:wa10;animation:f1 .5s infinite"></div>
                <div style="grid-area:wa13;animation:f0 .5s infinite"></div>
                <div style="grid-area:wa16;animation:f1 .5s infinite"></div>
                <div style="grid-area:wa1;animation:f0 .5s infinite"></div>
                <div style="grid-area:wa2;animation:f1 .5s infinite"></div>
                <div style="grid-area:wa3;animation:f1 .5s infinite"></div>
                <div style="grid-area:wa6;animation:f0 .5s infinite"></div>
                <div style="grid-area:wa8;animation:f0 .5s infinite"></div>
                <div style="grid-area:wa9;animation:f1 .5s infinite"></div>
                <div style="grid-area:wa11;animation:f0 .5s infinite"></div>
                <div style="grid-area:wa12;animation:f0 .5s infinite"></div>
                <div style="grid-area:wa15;animation:f1 .5s infinite"></div>
                <div style="grid-area:wa17;animation:f1 .5s infinite"></div>
                <div style="grid-area:wa18;animation:f0 .5s infinite"></div>
              </div>
              <div style="width:40px;height:50px;position:absolute;top:30px;left:10px">
                <div style="content:'';background:white;width:20px;height:50px;transform:translateX(10px);display:block;position:absolute"></div>
                <div style="content:'';background:white;width:40px;height:30px;transform:translateY(10px);display:block;position:absolute"></div>
                <div style="width:20px;height:20px;background:#4c1d95;position:absolute;top:20px;left:10px;z-index:1;animation:eyes 3s infinite"></div>
              </div>
              <div style="width:40px;height:50px;position:absolute;top:30px;right:30px">
                <div style="content:'';background:white;width:20px;height:50px;transform:translateX(10px);display:block;position:absolute"></div>
                <div style="content:'';background:white;width:40px;height:30px;transform:translateY(10px);display:block;position:absolute"></div>
                <div style="width:20px;height:20px;background:#4c1d95;position:absolute;top:20px;right:20px;z-index:1;animation:eyes 3s infinite"></div>
              </div>
              <div style="background:#7c3aed;width:140px;height:140px;position:absolute;border-radius:50%;transform:rotateX(80deg);filter:blur(20px);top:80%;animation:gshadow .5s infinite"></div>
            </div>
          </div>
          <div class="welcome-title">What do you want to build?</div>
          <div class="welcome-sub">Describe your idea and Pixel will plan, code, and deploy it for you.</div>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-row">
          <textarea class="input-field" id="main-input"
            placeholder="Describe what you want to build…"
            rows="1" oninput="autoResize(this)"></textarea>
          <button class="btn-send" id="btn-send" onclick="handleSend()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- RIGHT: Preview -->
    <div class="right-panel">
      <div class="preview-topbar">
        <div class="preview-tab active">Preview</div>
        <div class="preview-url" id="preview-url">—</div>
      </div>
      <div class="preview-body" id="preview-body">
        <!-- Empty state -->
        <div class="preview-empty" id="preview-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8m-4-4v4"/>
          </svg>
          <p>Your app preview will appear here</p>
        </div>
        <!-- Skeleton (shown while building) -->
        <div class="skeleton-wrap" id="skeleton" style="display:none">
          <div class="skel skel-header"></div>
          <div class="skel skel-hero"></div>
          <div class="skel skel-row" style="width:70%"></div>
          <div class="skel skel-row" style="width:55%"></div>
          <div class="skel skel-row" style="width:80%"></div>
          <div class="skel-cards">
            <div class="skel skel-card"></div>
            <div class="skel skel-card"></div>
            <div class="skel skel-card"></div>
          </div>
          <div class="skel skel-row" style="width:60%"></div>
          <div class="skel skel-row" style="width:40%"></div>
        </div>
        <!-- iframe -->
        <iframe id="preview-iframe" style="display:none;width:100%;height:100%;border:none" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
  const BACKEND    = 'https://pixel-production-051a.up.railway.app';
  const WS_BACKEND = 'wss://pixel-production-051a.up.railway.app';

  // ── State ──
  let chatHistory   = [];
  let pendingGoal   = '';
  let approvedGoal  = '';
  let mode          = 'chat'; // 'chat' | 'building'
  let deployUrl     = '';
  let pendingActions = []; // buffer file/cmd events while building

  // ── Utils ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function scrollFeed() {
    const f = document.getElementById('feed');
    f.scrollTop = f.scrollHeight;
  }

  // ── Input handling ──
  document.getElementById('main-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  });

  function handleSend() {
    const input = document.getElementById('main-input');
    const val = input.value.trim();
    if (!val || mode === 'building') return;
    input.value = ''; input.style.height = 'auto';

    // Hide welcome
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    addUserMessage(val);
    chatHistory.push({ role: 'user', content: val });
    showTyping();
    fetchPlanner();
  }

  // ── Feed helpers ──
  function addUserMessage(text) {
    const feed = document.getElementById('feed');
    const el = document.createElement('div');
    el.className = 'msg user fadein';
    el.innerHTML = `<div class="bubble">${esc(text).replace(/\n/g,'<br>')}</div>`;
    feed.appendChild(el);
    scrollFeed();
  }

  function addAgentMessage(text) {
    removeTyping();
    const feed = document.getElementById('feed');
    const el = document.createElement('div');
    el.className = 'msg agent fadein';

    // Detect architecture diagrams (box-drawing chars)
    const archRe = /((?:[┌┐└┘│─▶◀←→↓↑╔╗╚╝║═+|].+\n?)+)/g;
    let html = '<div class="agent-label">Pixel</div>';
    let last = 0, m;
    while ((m = archRe.exec(text)) !== null) {
      const before = text.slice(last, m.index).trim();
      if (before) html += `<div class="text">${esc(before).replace(/\n/g,'<br>')}</div>`;
      html += `<div class="arch-box">${esc(m[0])}</div>`;
      last = m.index + m[0].length;
    }
    const rest = text.slice(last).trim();
    if (rest) html += `<div class="text">${esc(rest).replace(/\n/g,'<br>')}</div>`;
    if (last === 0 && !rest) html += `<div class="text">${esc(text).replace(/\n/g,'<br>')}</div>`;

    el.innerHTML = html;
    feed.appendChild(el);
    scrollFeed();
  }

  function addReadyCard(goalSummary) {
    const feed = document.getElementById('feed');
    const el = document.createElement('div');
    el.className = 'fadein';
    el.innerHTML = `
      <div class="build-approved">
        <div class="build-approved-text">
          <strong>Ready to build</strong>
          Plan approved — Pixel will now write and deploy your app.
        </div>
        <button class="btn-build" onclick="startBuild()">Build →</button>
      </div>`;
    feed.appendChild(el);
    scrollFeed();
  }

  function showTyping() {
    const feed = document.getElementById('feed');
    if (document.getElementById('typing')) return;
    const el = document.createElement('div');
    el.id = 'typing'; el.className = 'msg agent fadein';
    el.innerHTML = `<div class="agent-label">Pixel</div><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    feed.appendChild(el);
    scrollFeed();
  }
  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  // ── Planner chat ──
  async function fetchPlanner() {
    document.getElementById('btn-send').disabled = true;
    try {
      const res = await fetch(`${BACKEND}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory }),
      });
      const data = await res.json();
      removeTyping();
      addAgentMessage(data.message);
      chatHistory.push({ role: 'assistant', content: data.message });

      if (data.ready) {
        approvedGoal = data.goalSummary || pendingGoal || chatHistory[0]?.content || '';
        addReadyCard(approvedGoal);
        // Update project name from goal
        const words = approvedGoal.split(/\s+/).slice(0,4).join(' ');
        document.getElementById('topbar-project').textContent = words + '…';
      }
    } catch {
      removeTyping();
      addAgentMessage('Something went wrong. Please try again.');
    }
    document.getElementById('btn-send').disabled = false;
    document.getElementById('main-input').focus();
  }

  // ── Start build ──
  async function startBuild() {
    mode = 'building';
    document.getElementById('btn-send').disabled = true;
    document.querySelector('.btn-build') && (document.querySelector('.btn-build').disabled = true);

    // Show skeleton
    document.getElementById('preview-empty').style.display = 'none';
    document.getElementById('skeleton').style.display = 'flex';

    // Add status message in feed
    addBuildStatusMessage();

    try {
      const res = await fetch(`${BACKEND}/api/build`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ goal: approvedGoal }),
      });
      const { sessionId, error } = await res.json();
      if (error) { onBuildError(error); return; }
      connectWS(sessionId);
    } catch {
      onBuildError('Could not reach Pixel backend.');
    }
  }

  // Build status in feed
  let statusEl = null;
  function addBuildStatusMessage() {
    const feed = document.getElementById('feed');
    statusEl = document.createElement('div');
    statusEl.className = 'msg agent fadein';
    statusEl.id = 'build-status-msg';
    statusEl.innerHTML = `
      <div class="agent-label">Pixel</div>
      <div class="text" id="build-status-text">Starting build pipeline…</div>
      <div class="actions-group" id="actions-group"></div>`;
    feed.appendChild(statusEl);
    scrollFeed();
  }

  function updateBuildStatus(text) {
    const el = document.getElementById('build-status-text');
    if (el) el.textContent = text;
    scrollFeed();
  }

  let actionCount = 0;
  function addActionPill(type, text) {
    const group = document.getElementById('actions-group');
    if (!group) return;
    actionCount++;
    const pill = document.createElement('div');
    pill.className = `action-pill ${type} fadein`;
    const icon = type === 'file'
      ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`
      : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>`;
    pill.innerHTML = `${icon}<span>${esc(text)}</span>`;
    // Keep only last 5 pills visible
    const pills = group.querySelectorAll('.action-pill');
    if (pills.length >= 5) pills[0].remove();
    group.appendChild(pill);
    scrollFeed();
  }

  // ── WebSocket ──
  function connectWS(sessionId) {
    const ws = new WebSocket(`${WS_BACKEND}/ws`);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'subscribe', sessionId }));
    ws.onmessage = e => handleEvent(JSON.parse(e.data), ws);
    ws.onerror = () => pollStatus(sessionId);
  }

  function handleEvent(ev, ws) {
    const { type, agent, message, data } = ev;

    if (type === 'command_output') return;

    if (type === 'agent_thinking') {
      updateBuildStatus(`${agent} is thinking…`);
      return;
    }
    if (type === 'agent_start') {
      updateBuildStatus(`${agent}: ${message.slice(0, 60)}`);
      return;
    }
    if (type === 'agent_log') {
      updateBuildStatus(`${agent}: ${message.slice(0, 60)}`);
      return;
    }
    if (type === 'file_written') {
      const path = data?.path || message;
      addActionPill('file', path.split('/').pop() + '  ·  ' + path);
      updateBuildStatus(`Writing files…`);
      return;
    }
    if (type === 'agent_complete') {
      updateBuildStatus(`${agent} ✓ ${message.slice(0,50)}`);
      return;
    }
    if (type === 'agent_error') {
      onBuildError(`${agent}: ${message}`);
      ws && ws.close();
      return;
    }
    if (type === 'pipeline_complete') {
      const url = data?.deployUrl || data?.url;
      onBuildComplete(url);
      ws && ws.close();
      return;
    }
    if (type === 'pipeline_error') {
      onBuildError(message);
      ws && ws.close();
      return;
    }
  }

  function onBuildComplete(url) {
    document.getElementById('skeleton').style.display = 'none';

    if (url && !url.startsWith('http://localhost')) {
      deployUrl = url;
      document.getElementById('preview-url').textContent = url;
      document.getElementById('preview-iframe').src = url;
      document.getElementById('preview-iframe').style.display = 'block';
      document.getElementById('btn-publish').style.display = 'block';
      updateBuildStatus(`✅ Deployed! Your app is live.`);
      addAgentMessage(`🚀 Your app is live at ${url}`);
    } else {
      updateBuildStatus('✅ Build complete.');
      addAgentMessage('Build complete! No deploy URL was returned.');
      document.getElementById('preview-empty').style.display = 'flex';
    }

    // Re-enable input for new builds
    mode = 'chat';
    document.getElementById('btn-send').disabled = false;
  }

  function onBuildError(msg) {
    document.getElementById('skeleton').style.display = 'none';
    document.getElementById('preview-empty').style.display = 'flex';
    updateBuildStatus(`❌ Build failed`);
    addAgentMessage(`Build failed: ${msg}\n\nYou can describe changes and I'll try again.`);
    mode = 'chat';
    document.getElementById('btn-send').disabled = false;
  }

  function openDeploy() {
    if (deployUrl) window.open(deployUrl, '_blank');
  }

  function pollStatus(sessionId) {
    const iv = setInterval(async () => {
      try {
        const d = await (await fetch(`${BACKEND}/api/status/${sessionId}`)).json();
        if (d.status !== 'running') {
          clearInterval(iv);
          if (d.result?.deployUrl) onBuildComplete(d.result.deployUrl);
          else onBuildError('No deploy URL');
        }
      } catch { clearInterval(iv); onBuildError('Lost connection'); }
    }, 3000);
  }
</script>
</body>
</html>
